paths-ignore:
  # Vendored dependencies are scanned in their respective repositories.
  - src/code.cloudfoundry.org/vendor/**
  - src/vendor/**

  # Historical Godeps dependencies include upstream test keys.
  - Godeps/_workspace/src/**

  # Unit and integration tests intentionally contain credentials and key fixtures.
  - "**/*_test.go"
  - spec/gorouter_templates_spec.rb
  - "**/test_util/**"
  - "**/test/assets/**"
  - fixtures/**
  - src/code.cloudfoundry.org/cf-tcp-router/cmd/cf-tcp-router/fixtures/metron/**
  - server/httptest/server.go

  # BOSH Lite and acceptance-test helpers share development client keys.
  - bosh-lite/stubs/property-overrides.yml
  - assets/desired_lrp-client/config/client.key
  - assets/diego-client/config/client.key

  # Orinoco was the CI acceptance-test environment, not a production foundation.
  # See 041f148988:router-deployments-runtime/ci/pipeline.yml (deploy-and-test).
  # These manifests moved out of this repository in July 2015 (805491d0e).
  - router-deployments-runtime/orinoco/deployments/cf.yml
  - router-deployments-runtime/orinoco/deployments/diego.yml

  # Standalone example configuration; BOSH obtains its secret from job properties.
  - example_config/example.yml
  - src/gorouter/example_config/example.yml
  - src/code.cloudfoundry.org/gorouter/example_config/example.yml

  # Historical ELF binary: a string-table fragment was mistaken for a bearer token.
  - src/gorouter/gorouter

  # README/docs and production job specs remain scanned despite example matches:
  # these files also contain deployment defaults and the unverified password (#40).
